# Worker de subidas de flyers a Cloudflare R2 · creandoproyectos
# Todo lo que está acá es PÚBLICO (puede ir a GitHub). No hay claves secretas:
# el acceso al bucket se hace por "binding", sin access keys.
name = "creandoproyectos-uploads"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Si tu Worker usa un nombre distinto al de arriba, cambialo (el nombre define la URL *.workers.dev).

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "creandoproyectos-imagenes"   # nombre del bucket que creás en Cloudflare → R2 (si usás otro nombre, cambialo acá)

[vars]
# Project Settings → API de Supabase (la URL y la clave PUBLISHABLE; nunca la secret/service_role).
SUPABASE_URL = "https://REEMPLAZAR.supabase.co"
SUPABASE_ANON_KEY = "REEMPLAZAR-publishable-key"
# Dominio público de las imágenes (el que conectás al bucket), sin barra final.
R2_PUBLIC_URL = "https://imagenes.REEMPLAZAR.com"
# Sitios autorizados a llamar al Worker, separados por coma.
ALLOWED_ORIGINS = "https://www.REEMPLAZAR.com,https://REEMPLAZAR.com,http://localhost:5173"
